# Include inside the main-domain server block, ahead of the generic
# `location /storage/` alias (same pattern as tax-documents.nginx.conf).
# Laravel already 404s these paths when PHP sees them; nginx serves
# `storage/app/public` directly, so this snippet is required to stop
# historical shoot photos and share-link ZIPs from bypassing paywall,
# watermark, and revoke.
#
# Do not apply this until the corresponding app deploy is live: new
# objects are written to the private disk and served via signed
# `/api/public/shoot-media/file/...` URLs. Existing files under
# `storage/app/public/shoots/` and `storage/app/public/share-links/`
# stay on disk until a later copy/migrate; after this location is
# enabled they return 404 instead of bytes.
location = /storage/shoots {
    return 404;
}
location ^~ /storage/shoots/ {
    return 404;
}
location = /storage/share-links {
    return 404;
}
location ^~ /storage/share-links/ {
    return 404;
}
