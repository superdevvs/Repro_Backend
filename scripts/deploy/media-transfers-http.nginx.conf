# http context only. Original URIs are used only for classification, never logged.
map $request_uri $repro_transfer_family {
    default off;
    ~^/api/public/shoot-media/file/ signed_media;
    ~^/api/public/share-links/ share_link;
    ~^/api/shoots/\d+/(?:upload|upload-batches|upload-chunks) upload;
    ~^/api/shoots/\d+/(?:editor-download-raw|media/download-zip|files/download) archive;
    ~^/api/shoots/\d+/files/ media;
    ~^/api/images/\d+/download/ media;
    ~^/api/images/download/batch archive;
    ~^/api/download/ media;
    ~^/api/ api;
}
map $repro_transfer_family $repro_transfer_loggable { off 0; default 1; }
map $upstream_http_x_request_id $repro_transfer_request_id {
    default "";
    "~^[A-Za-z0-9-]{1,80}$" $upstream_http_x_request_id;
}
map $http_cf_ray $repro_transfer_cf_ray {
    default "";
    "~^[A-Fa-f0-9]{1,32}-[A-Za-z]{3}$" $http_cf_ray;
}
log_format repro_transfers escape=json '{"time":"$time_iso8601","family":"$repro_transfer_family","request_id":"$repro_transfer_request_id","cf_ray":"$repro_transfer_cf_ray","status":$status,"request_bytes":$request_length,"body_bytes":$body_bytes_sent,"total_seconds":$request_time,"upstream_seconds":"$upstream_response_time","upstream_connect_seconds":"$upstream_connect_time","upstream_header_seconds":"$upstream_header_time"}';
