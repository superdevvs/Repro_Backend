# Optional prettier alias for first-party short links.
# The app already serves these at /api/g/{code}/... through the existing
# `location ^~ /api` block, so this include is not required for the feature
# to work. Add it only if you want https://reprodashboard.com/g/{code} as well.
#
# Include inside the main-domain server block, ahead of the SPA fallback.
location ^~ /g/ {
    include snippets/fastcgi-php.conf;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
