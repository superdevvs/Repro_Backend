# Include in both existing HTTPS server blocks after installing the http snippet.
# Preserve the inherited ordinary access log alongside the dedicated sanitized log.
access_log /var/log/nginx/access.log;
access_log /var/log/nginx/repro-transfers.jsonl repro_transfers if=$repro_transfer_loggable;

location ^~ /_repro-media/private/ {
    internal;
    alias /var/www/backend/storage/app/private/;
    sendfile on;
    aio threads;
    disable_symlinks on;
}
location ^~ /_repro-media/originals/ {
    internal;
    alias /mnt/16tb/repro/media-originals/;
    sendfile on;
    aio threads;
    disable_symlinks on;
}
location ^~ /_repro-media/legacy/ {
    internal;
    alias /var/www/backend/storage/app/public/;
    sendfile on;
    aio threads;
    disable_symlinks on;
}
location ^~ /_repro-media/downloads/ {
    internal;
    alias /var/www/backend/storage/app/private/downloads/;
    sendfile on;
    aio threads;
    disable_symlinks on;
}
