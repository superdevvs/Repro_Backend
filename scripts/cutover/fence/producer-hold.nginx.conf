# Producer replay hold for the Dashboard edge (P2-04, P2-07).
#
# Each Dashboard server block (frontend.conf and laravel.conf) carries, once:
#     include /etc/nginx/repro-holds/*.conf;
# The directory is empty in normal running. To hold producers, copy this file
# there, run `nginx -t` and reload. To release, remove it, `nginx -t`, reload.
#
# Every held path answers 503 with Retry-After. Never 403, 404 or a redirect:
# the website outbox, the booking forwarder and the providers treat those as
# permanent. Telnyx paths are left to the Telnyx capture route.
#
# Retry-After is fixed at 60 because nginx cannot read
# PRODUCER_INGRESS_RETRY_AFTER; edit the four lines if that value changes.
# An add_header inside these locations replaces every add_header inherited
# from the server block (HSTS, for example), but only on these held 503s.
# Producers do not use those headers.

location ^~ /api/external/ {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 503 '{"received":false,"retryable":true,"error":"producer_ingress_held"}';
}

location = /api/webhooks/resend {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 503 '{"received":false,"retryable":true,"error":"producer_ingress_held"}';
}

location ^~ /api/webhooks/stripe {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 503 '{"received":false,"retryable":true,"error":"producer_ingress_held"}';
}

location ^~ /api/integrations/aryeo/webhooks/ {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 503 '{"received":false,"retryable":true,"error":"producer_ingress_held"}';
}
