# Installed as /etc/tmpfiles.d/repro-cutover-fence.conf.
# /run is a fresh tmpfs after every boot. Recreate the cutover runtime
# directories before nginx, the writer wrappers and the watchdog timer start.
# Root-owned 0755: the guard refuses group or other write bits in its chain,
# and nginx workers must traverse the ingress directory to find the open
# marker. The directories start empty, so every writer stays held until the
# operator runs 'cli.py refresh' and 'cli.py reopen'.
d /run/repro-cutover-fence 0755 root root -
d /run/repro-cutover-ingress 0755 root root -
