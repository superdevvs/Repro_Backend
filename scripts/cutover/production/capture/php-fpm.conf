; PHP-FPM master of the hold-time Telnyx capture (design v2, 5.2).
;
; Installed as /etc/repro-telnyx-capture/php-fpm.conf (root, 0644) and run by
; repro-telnyx-capture.service. It is a separate master from php8.3-fpm: the
; freeze drains and stops the app's FPM, never this one, so the host config's
; drain_fpm, stop_workers and writer_processes must never name or match it
; ("php-fpm: pool repro-telnyx-capture"). Its one script, capture.php, opens
; no database; it saves signed Telnyx webhooks into the receiver's spool.
;
; nginx (repro-cutover-hold.conf) reaches it on the socket below while the
; open marker is missing. /run/repro-telnyx-capture comes from
; tmpfiles.d/repro-cutover-fence.conf at every boot.

[global]
pid = /run/repro-telnyx-capture/php-fpm.pid
error_log = syslog
syslog.ident = repro-telnyx-capture
daemonize = no

[repro-telnyx-capture]
; The app pool's user, so spool entries get the same owner and group as
; captures saved by the app during a deploy (TelnyxMaintenanceSpool).
user = www-data
group = www-data
; nginx workers run as www-data.
listen = /run/repro-telnyx-capture/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = static
pm.max_children = 4
; A capture holds the spool's capture lock while it saves. A stuck child is
; ended, so the lock is released and a replay never waits on it for long;
; Telnyx then gets 503 from nginx and retries.
request_terminate_timeout = 20s
clear_env = yes
env[REPRO_TELNYX_CAPTURE_SETTINGS] = /etc/repro-telnyx-capture/capture.json
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
