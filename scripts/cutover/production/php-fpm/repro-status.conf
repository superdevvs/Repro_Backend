; Cutover FPM drain (design v2, 5.4): the status page of the app's pool on a socket of its own.
;
; Installed as /etc/php/8.3/fpm/pool.d/zz-repro-status.conf (root 0644) in administrator session W1,
; checked with `php-fpm8.3 -t`, then one `systemctl reload php8.3-fpm.service` at a quiet hour. A
; USR2 reload keeps the master and adds the status socket; a USR2 reload whose config fails the test
; stops FPM (both seen in the QA image), so the test comes first.
;
; php-fpm merges a repeated pool section, so this reopens the [www] pool of www.conf (the "zz-" name
; sorts it after www.conf) and changes nothing else. A host whose app pool is not [www] fails the test:
; a new [www] pool without `listen` is refused.
;
; pm.status_listen serves the page from its own small pool, so the drain's status requests never
; occupy an app child and never count as accepted connections (experiment E8). The socket takes the
; pool's listen.owner, listen.group and listen.mode (www-data 0660 on Debian); root, the controller,
; connects. host.json fpm.status_socket names the same path, and fpm_drain.STATUS_PATH this page.
; The page also answers on the main socket, which nginx never reaches with this SCRIPT_NAME (its PHP
; locations pass only *.php scripts).
[www]
pm.status_path = /repro-fpm-status
pm.status_listen = /run/php/php8.3-fpm-status.sock
