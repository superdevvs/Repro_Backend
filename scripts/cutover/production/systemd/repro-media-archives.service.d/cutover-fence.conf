# Drop-in for repro-media-archives.service (Restart=always).
# Start the worker through the root admission wrapper, which verifies the
# cutover journal and keeps the shared writer lease for the worker's whole
# life, so the cutover drain waits for it. '+' runs the wrapper with full
# privileges; it drops to the profile's user (www-data) itself.
[Service]
ExecStart=
ExecStart=+/usr/bin/python3 -I -S /opt/repro-cutover-fence/production/admit.py media-archives
# A held admission exits 75: do not restart into a loop while held.
RestartPreventExitStatus=75
