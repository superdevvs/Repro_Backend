# Cutover admission hold, server level.
#
# Include inside every server block that can reach the Laravel PHP pool,
# before any location: frontend.conf (same-origin '^~ /api') and laravel.conf
# (front-controller rewrite and the direct '~ \.php$' location). Being at
# server level, it also covers /cubicasa_webhook.php and /iguide_webhook.php,
# which answer 200 before Laravel boots, so a PHP-level gate cannot hold them.
#
# Every request gets 503 with Retry-After unless the open marker exists.
# /run is a tmpfs, so each boot starts held until the cutover controller has
# verified authority and created the marker again. Only root can create it;
# tmpfiles.d/repro-cutover-fence.conf recreates its directory at every boot
# (root, 0755), and the controller does too before it writes the marker.
#
# Telnyx: while held, the Telnyx webhook paths go to the hold-time capture
# (repro-telnyx-capture.service: its own PHP-FPM master, which the freeze
# never drains, and capture.php, which opens no database). It saves signed
# texts into the app's Telnyx spool for telnyx:replay-spool and answers 200;
# call events are saved and answered 503. The capture lives in this one
# include on purpose: a server block cannot have the hold without it. A
# capture that is down, fails, cannot read capture.php or gets a body over
# 1 MiB answers 503 with Retry-After, never 502, 404 or 403, so Telnyx
# retries. With the marker, Telnyx reaches the app like everything else. A
# direct request for the internal URI never reaches the capture: it gets the
# hold's 503 with or without the marker.
#
# Requires both http-level maps in repro-cutover-gate.conf; without the
# Telnyx map nginx -t fails with 'unknown "repro_cutover_telnyx" variable'.
set $repro_cutover_held $repro_cutover_gate;
set $repro_telnyx_capture $repro_cutover_telnyx;
if (-f /run/repro-cutover-ingress/open) {
    set $repro_cutover_held 0;
    set $repro_telnyx_capture 0;
}
if ($repro_telnyx_capture) {
    rewrite ^ /__repro_telnyx_capture last;
}
if ($repro_cutover_held) {
    return 503;
}
error_page 503 @repro_cutover_held;
location @repro_cutover_held {
    default_type application/json;
    add_header Retry-After 30 always;
    return 503 '{"admission_held":true}';
}
location = /__repro_telnyx_capture {
    internal;
    client_max_body_size 1m;
    fastcgi_pass unix:/run/repro-telnyx-capture/php-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/repro-telnyx-capture/capture.php;
    fastcgi_param SCRIPT_NAME /__repro_telnyx_capture;
    fastcgi_param REQUEST_URI $request_uri;
    # Only these codes are taken over; the capture's own 200, 405 and 503
    # answers pass through unchanged. 403 and 404 are PHP-FPM's answers for a
    # capture.php it cannot open or find (and nginx's own 404 for a direct
    # request to this internal URI), 413 a body over 1 MiB, 500, 502 and 504 a
    # capture that failed, is down or hung. None of them saved anything.
    fastcgi_intercept_errors on;
    error_page 403 404 413 500 502 504 = @repro_cutover_held;
}
