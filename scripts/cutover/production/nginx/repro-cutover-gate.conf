# Cutover admission gate, http level (for example
# /etc/nginx/conf.d/repro-cutover-gate.conf). repro-cutover-hold.conf reads
# both maps, so nginx -t refuses a server block with the hold include while
# this file (or either map) is missing.
#
# $repro_cutover_gate: every request is subject to the hold. Keep the default
# at 1 with no exemption. An exemption would let a request reach Laravel,
# which has no cutover gate of its own, so any smoke-test bypass needs its own
# reviewed design.
#
# $repro_cutover_telnyx: 1 for exactly the Telnyx webhook paths the app
# routes (texts, status updates, voice, and shared MMS with a UUID, the
# route's whereUuid()). While the hold is in force, the hold include sends
# these to the hold-time capture, which saves them for replay instead of
# answering 503. Everything else stays held.
map $uri $repro_cutover_gate {
    default 1;
}
map $uri $repro_cutover_telnyx {
    default 0;
    /api/webhooks/telnyx/messaging 1;
    /api/webhooks/telnyx/status 1;
    /api/webhooks/telnyx/voice 1;
    "~^/api/webhooks/telnyx/shared-mms/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$" 1;
}
