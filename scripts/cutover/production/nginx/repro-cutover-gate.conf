# Cutover admission gate, http level (for example
# /etc/nginx/conf.d/repro-cutover-gate.conf). Every request is subject to the
# hold in repro-cutover-hold.conf. Keep the default at 1. An exemption here
# would let a request reach Laravel, which has no cutover gate of its own,
# so any smoke-test bypass needs its own reviewed design.
map $uri $repro_cutover_gate {
    default 1;
}
