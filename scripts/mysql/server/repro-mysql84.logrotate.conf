# Installed only at /etc/repro-mysql84/logrotate.conf, not in /etc/logrotate.d.
# The dedicated hourly timer uses its own root-owned state file.
/var/lib/repro-mysql84/slow.log {
    daily
    maxsize 100M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    su repro-mysql84 www-data
    create 0600 repro-mysql84 www-data
    sharedscripts
    prerotate
        /usr/bin/docker compose --project-name repro-mysql84 --file /etc/repro-mysql84/compose.yaml exec -T mysql mysql --defaults-file=/run/secrets/root-client.cnf --no-login-paths --connect-timeout=5 --batch --skip-column-names --execute='SELECT 1' >/dev/null
    endscript
    postrotate
        /usr/bin/docker compose --project-name repro-mysql84 --file /etc/repro-mysql84/compose.yaml exec -T mysql mysql --defaults-file=/run/secrets/root-client.cnf --no-login-paths --connect-timeout=5 --batch --execute='FLUSH SLOW LOGS'
    endscript
}
