# Dedicated timer only; do not also install in /etc/logrotate.d.
/var/log/repro-mysql84-native/error.log /var/log/repro-mysql84-native/slow.log {
    daily
    maxsize 100M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    su repro-mysql84-native repro-mysql84-native
    create 0600 repro-mysql84-native repro-mysql84-native
    sharedscripts
    prerotate
        /usr/bin/python3 -I /opt/repro-mysql84-native/ops/native_mysql.py check >/dev/null
    endscript
    postrotate
        /usr/bin/python3 -I /opt/repro-mysql84-native/ops/native_mysql.py flush-logs
    endscript
}
