name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      clamav:
        image: clamav/clamav:1.4.5-debian13-slim
        ports:
          - 3310:3310

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_sqlite, sqlite3, sodium
          tools: composer:2.10.2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Wait for ClamAV
        shell: bash
        run: |
          for attempt in {1..90}; do
            if printf 'PING\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          echo 'ClamAV did not become ready in time.' >&2
          exit 1

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          CLAMAV_SOCKET: ''
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
        run: composer quality

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server (rsync)
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: >-
            -avzr --delete
            --exclude='.env'
            --exclude='storage/***'
            --exclude='database/database.sqlite'
            --exclude='vendor/'
            --exclude='.git/'
          path: ./
          remote_path: /var/www/backend/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: Run backend install/migrate/cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/backend
            php -r '$data = json_decode(shell_exec("composer --version --format=json"), true); $version = $data["version"] ?? "0"; if (version_compare($version, "2.10.2", "<")) { fwrite(STDERR, "Composer 2.10.2 or newer is required; found {$version}.\n"); exit(1); }'
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
