name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      clamav:
        image: clamav/clamav:1.4.5-debian13-slim
        ports:
          - 3310:3310

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Fail if env, key, or pem files are tracked
        run: php scripts/check-tracked-secrets.php

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_sqlite, sqlite3, sodium
          tools: composer:2.10.2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Wait for ClamAV
        shell: bash
        run: |
          for attempt in {1..90}; do
            if printf 'PING\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          echo 'ClamAV did not become ready in time.' >&2
          exit 1

      - name: Prepare test environment file
        run: |
          # phpdotenv reads .env on every boot and PHPUnit turns the resulting
          # "failed to open stream" warning into a test warning. composer quality
          # runs artisan test with --fail-on-warning, so a missing .env fails the
          # job on its own. This stays minimal rather than copying .env.example:
          # what the suite needs is declared in phpunit.xml, and inheriting the
          # example's integration defaults would let them drift into test runs.
          printf 'APP_ENV=testing\n' > .env

      - name: Generate throwaway CI APP_KEY
        run: |
          set -euo pipefail
          key="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_KEY=$key" >> "$GITHUB_ENV"

      - name: Run test suite
        env:
          APP_ENV: testing
          # Fresh throwaway APP_KEY is generated in the previous step so this
          # repo never stores a key-shaped value. Unrelated to production.
          # DB_CONNECTION / DB_DATABASE are deliberately not set here. Defining
          # them suppressed phpunit.xml's :memory: database, so the suite ran
          # against a persistent sqlite file and tables leaked between tests.
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          CLAMAV_SOCKET: ''
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
        run: composer quality
