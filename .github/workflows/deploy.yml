name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      clamav:
        image: clamav/clamav:1.4.5-debian13-slim
        ports:
          - 3310:3310

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if env, key, or pem files are tracked
        run: php scripts/check-tracked-secrets.php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_sqlite, sqlite3, sodium
          tools: composer:2.10.2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Wait for ClamAV
        shell: bash
        run: |
          for attempt in {1..90}; do
            if printf 'PING\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          echo 'ClamAV did not become ready in time.' >&2
          exit 1

      - name: Prepare test environment file
        run: |
          # phpdotenv reads .env on every boot and PHPUnit turns the resulting
          # "failed to open stream" warning into a test warning. composer quality
          # runs artisan test with --fail-on-warning, so a missing .env fails the
          # job on its own. This stays minimal rather than copying .env.example:
          # what the suite needs is declared in phpunit.xml, and inheriting the
          # example's integration defaults would let them drift into test runs.
          printf 'APP_ENV=testing\n' > .env

      - name: Run test suite
        env:
          APP_ENV: testing
          # Laravel refuses to boot without an encryption key, so every test that
          # touches encryption, cookies or sessions fails with
          # MissingAppKeyException. Locally the key comes from .env, which is not
          # committed, so CI had none. This is a throwaway key used only by this
          # test step and is unrelated to any deployed environment's key.
          APP_KEY: base64:6lMq/5Rp/MERfmkNOn2kZk0OhSjmKDNTazouBbBC/Xc=
          # DB_CONNECTION / DB_DATABASE are deliberately not set here. Defining
          # them suppressed phpunit.xml's :memory: database, so the suite ran
          # against a persistent sqlite file and tables leaked between tests.
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          CLAMAV_SOCKET: ''
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
        run: composer quality

  deploy:
    needs: quality
    # Desktop releases already run the same quality gate and deploy through the
    # workstation's allowlisted SSH path. Keep CI validation for those commits,
    # but do not start a second hosted deploy that cannot reach the server.
    if: ${{ !contains(github.event.head_commit.message, '[desktop-deploy]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rsync lands new code before migrate runs below, so without this the app
      # briefly serves requests that reference columns the database does not have
      # yet. Maintenance mode has to start before the copy, not just before the
      # migration. The flag lives under storage/, which rsync excludes, so the
      # copy cannot clear it.
      - name: Enter maintenance mode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/backend
            php artisan down --retry=15 || true

      - name: Deploy to server (rsync)
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: >-
            -avzr --delete
            --exclude='.env'
            --exclude='storage/***'
            --exclude='database/database.sqlite'
            --exclude='vendor/'
            --exclude='.git/'
          path: ./
          remote_path: /var/www/backend/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: Run backend install/migrate/cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/backend
            php -r '$data = json_decode(shell_exec("composer --version --format=json"), true); $version = $data["version"] ?? "0"; if (version_compare($version, "2.10.2", "<")) { fwrite(STDERR, "Composer 2.10.2 or newer is required; found {$version}.\n"); exit(1); }'
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart

      # always(): a failure above must not strand the site in maintenance mode.
      - name: Leave maintenance mode
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/backend
            php artisan up
