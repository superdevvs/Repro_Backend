name: Deploy Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mysql:
    uses: ./.github/workflows/mysql.yml

  # Repository and dependency checks that do not need the test suite.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Fail if env, key, or pem files are tracked
        run: php scripts/check-tracked-secrets.php

      - name: Test deployment storage safeguards
        run: python3 scripts/deploy/test_deployment_storage.py

      - name: Test download TCP installer
        run: python3 scripts/deploy/test_install_download_tcp.py

      - name: Test deploy maintenance window (scheduler hold, Telnyx replay)
        run: python3 scripts/deploy/test_deploy_maintenance_window.py

      - name: Test database migration contracts
        run: |
          python3 -m unittest discover -s scripts/mysql
          python3 -m unittest discover -s scripts/mysql/native
          python3 -m unittest discover -s scripts/mysql/offsite
          python3 -m unittest discover -s scripts/mysql/offsite/systemd
          python3 -m unittest discover -s scripts/mysql/offsite/systemd/binlog-fixture
          python3 -m unittest discover -s scripts/mysql/workload
          python3 -m unittest discover -s scripts/cutover
          python3 -m unittest discover -s scripts/cutover/fence
          python3 -m unittest discover -s scripts/cutover/readiness
          python3 -m unittest discover -s scripts/cutover/nightly
          python3 -m unittest discover -s scripts/cutover/production
          python3 -m unittest discover -s scripts/cutover/production/sandbox
          python3 -m unittest discover -s scripts/cutover/probe
          python3 -m unittest discover -s scripts/cutover/host

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, gd
          tools: composer:2.10.2
          coverage: none

      - name: Test independent database verification
        run: php scripts/mysql/test-verify-fields.php

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked

  # The full PHPUnit suite, split across parallel jobs and, inside each job,
  # across concurrent PHPUnit processes (scripts/ci/run_phpunit_shard.py).
  # Run serially it took ~37 minutes. Every test file still runs exactly once
  # with the same --fail-on-* flags as `composer test`. Deploy-App.ps1 waits for
  # this whole workflow run, so a failure in any job blocks a deploy.
  quality:
    name: quality (tests ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      clamav:
        image: clamav/clamav:1.4.5-debian13-slim
        ports:
          - 3310:3310

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_sqlite, sqlite3, sodium, gd
          tools: composer:2.10.2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install media rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils imagemagick ffmpeg fonts-dejavu-core

      - name: Wait for ClamAV
        shell: bash
        run: |
          for attempt in {1..90}; do
            if printf 'PING\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          echo 'ClamAV did not become ready in time.' >&2
          exit 1

      - name: Prepare test environment file
        run: |
          # phpdotenv reads .env on every boot and PHPUnit turns the resulting
          # "failed to open stream" warning into a test warning. The suite runs
          # with --fail-on-warning, so a missing .env fails the job on its own.
          # This stays minimal rather than copying .env.example: what the suite
          # needs is declared in phpunit.xml, and inheriting the example's
          # integration defaults would let them drift into test runs.
          printf 'APP_ENV=testing\n' > .env

      - name: Generate throwaway CI APP_KEY
        run: |
          set -euo pipefail
          key="base64:$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_KEY=$key" >> "$GITHUB_ENV"

      - name: Run test suite (shard ${{ matrix.shard }} of 3)
        env:
          APP_ENV: testing
          # Fresh throwaway APP_KEY is generated in the previous step so this
          # repo never stores a key-shaped value. Unrelated to production.
          # DB_CONNECTION / DB_DATABASE are deliberately not set here. Defining
          # them suppressed phpunit.xml's :memory: database, so the suite ran
          # against a persistent sqlite file and tables leaked between tests.
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          CLAMAV_SOCKET: ''
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: 3310
        run: |
          php artisan config:clear --ansi
          python3 scripts/ci/run_phpunit_shard.py --shard-index ${{ matrix.shard }} --shard-total 3 --workers "$(nproc)"

      - name: Keep JUnit timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: phpunit-junit-${{ matrix.shard }}
          path: build/phpunit/*.xml
          if-no-files-found: ignore
          retention-days: 14
